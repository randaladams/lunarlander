name: Build APK

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Engine checks (autopilot landings + screenshots)
        run: |
          mkdir -p build/engine-check
          javac -d build/engine-check/classes $(find app/src/main/java/com/adamselite/lunarlander/engine -name '*.java') tools/desktop/src/*.java
          java -Djava.awt.headless=true -cp build/engine-check/classes EngineCheck build/engine-check/screenshots

      - name: Build debug APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Rename APK
        run: cp app/build/outputs/apk/debug/app-debug.apk lunarlander.apk

      - uses: actions/upload-artifact@v4
        with:
          name: lunarlander-apk
          path: |
            lunarlander.apk
            build/engine-check/screenshots/*.png

      # Every push to main replaces the "latest" pre-release, so the newest
      # APK is always one tap away on your phone:
      # https://github.com/<owner>/<repo>/releases/tag/latest
      - name: Publish to the "latest" release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Remove every previous "latest" release (drafts included) and its
          # tag, so the new one can always be created.
          for id in $(gh api "repos/${GITHUB_REPOSITORY}/releases?per_page=100" -q '.[] | select(.tag_name=="latest") | .id'); do
            gh api -X DELETE "repos/${GITHUB_REPOSITORY}/releases/${id}"
          done
          gh api -X DELETE "repos/${GITHUB_REPOSITORY}/git/refs/tags/latest" || true
          gh release create latest lunarlander.apk build/engine-check/screenshots/*.png \
            --title "Latest build ($(git rev-parse --short HEAD))" \
            --notes "Automatic build of main at ${GITHUB_SHA}. On your Android device, download lunarlander.apk and open it to install (allow installs from your browser when asked)." \
            --prerelease --target "${GITHUB_SHA}"
